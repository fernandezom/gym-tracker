<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--surface:#141414;--card:#1c1c1c;--border:#272727;
  --accent:#c8ff00;--accent-dim:#8aab30;--text:#f0f0f0;--muted:#555;
  --green:#4ade80;--green-bg:#0d1f0d;--green-border:#1e4020;
  --orange:#fb923c;--orange-bg:#1f120a;--orange-border:#4a2a0a;
  --blue:#60a5fa;--red:#f87171;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;overflow:hidden}

/* -- LAYOUT -- */
#app{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);flex:1;letter-spacing:.06em}
.header-right{text-align:right;font-size:11px;color:var(--muted);line-height:1.4}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
.scroll-body{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.scroll-body::-webkit-scrollbar{display:none}

/* -- BUTTONS -- */
.btn{border:none;border-radius:var(--radius-sm);padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s,transform .08s;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#000}
.btn-accent:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* -- SCREEN 1: PICKER -- */
.search-wrap{position:relative;margin-bottom:10px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px 10px 38px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}

.ex-list{display:flex;flex-direction:column;gap:5px}
.ex-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .12s,background .12s;user-select:none}
.ex-item:active{transform:scale(.99)}
.ex-item.sel{border-color:var(--accent);background:#141a00}
.ex-name{font-size:13px;font-weight:500}
.ex-meta{font-size:11px;color:var(--muted);margin-top:1px}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:.12s;color:#000}
.ex-item.sel .chk{background:var(--accent);border-color:var(--accent)}

.pick-footer{padding:10px 14px 20px;flex-shrink:0;border-top:1px solid var(--border);background:var(--surface)}
.sel-count{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px;min-height:18px}

/* -- SCREEN 2: WORKOUT -- */
.ex-nav{display:flex;gap:5px;overflow-x:auto;padding:10px 14px 8px;flex-shrink:0;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ex-nav::-webkit-scrollbar{display:none}
.ex-tab{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s;user-select:none}
.ex-tab.cur{background:var(--accent);color:#000;border-color:var(--accent)}
.ex-tab.ok{color:var(--muted);border-color:#1e1e1e}
.ex-tab.ok.cur{background:var(--surface);color:var(--text);border-color:var(--accent)}

/* exercise card */
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.ex-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ex-card-name{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:.04em;line-height:1}
.ex-card-date{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}

.pr-pill{display:inline-flex;align-items:center;gap:5px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--green);margin-bottom:10px}

.target-box{background:#0c1500;border:1px solid #2a3d00;border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.target-txt{flex:1}
.target-lbl{font-size:10px;color:var(--accent-dim);text-transform:uppercase;letter-spacing:.07em}
.target-val{font-size:14px;color:var(--accent);font-weight:600;margin-top:1px}

/* last session table */
.section-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.last-tbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.last-tbl th{font-size:10px;color:var(--muted);font-weight:500;padding:4px 6px;text-align:center;border-bottom:1px solid var(--border)}
.last-tbl th:first-child{text-align:left;width:28px}
.last-tbl td{padding:6px 6px;text-align:center;font-size:13px;font-weight:500;border-bottom:1px solid #1a1a1a}
.last-tbl td:first-child{text-align:left;font-size:11px;color:var(--muted)}
.last-tbl tr:last-child td{border-bottom:none}
.pr-tag{background:var(--green-bg);border:1px solid var(--green-border);border-radius:10px;font-size:10px;color:var(--green);padding:1px 6px}

/* log sets */
.log-set{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:grid;grid-template-columns:26px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:6px;transition:border-color .15s}
.log-set.done{border-color:var(--green-border);background:var(--green-bg)}
.set-lbl{font-size:11px;color:var(--muted);font-weight:600}
.set-inp{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 6px;color:var(--text);font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;width:100%;text-align:center;outline:none;-webkit-appearance:none}
.set-inp:focus{border-color:var(--accent)}
.log-set.done .set-inp{border-color:#1a3020;background:#0d1a0f}
.done-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.12s;flex-shrink:0}
.done-btn.on{background:var(--green);border-color:var(--green);color:#000}

.add-set-btn{width:100%;background:transparent;border:1px dashed var(--border);border-radius:10px;padding:9px;color:var(--muted);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:10px;transition:.12s}
.add-set-btn:hover{border-color:var(--accent);color:var(--accent)}

.nav-row{display:flex;gap:8px}
.nav-row .btn{flex:1}

/* -- REST TIMER -- */
.timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.timer-overlay.show{opacity:1;pointer-events:all}
.timer-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.timer-ring{position:relative;width:220px;height:220px;margin-bottom:24px}
.timer-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:6}
.ring-bg{stroke:#1e1e1e}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.timer-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-secs{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--accent);letter-spacing:.02em;line-height:1}
.timer-sub{font-size:11px;color:var(--muted);margin-top:2px}
.timer-btns{display:flex;gap:10px;width:100%;padding:0 32px}
.timer-btns .btn{flex:1;padding:14px}
.rest-presets{display:flex;gap:8px;margin-bottom:24px}
.preset{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s}
.preset.active{background:#141a00;border-color:var(--accent);color:var(--accent)}
.preset:active{transform:scale(.95)}

/* -- SCREEN 3: SUMMARY -- */
.summary-top{text-align:center;padding:28px 20px 20px}
.summary-top h2{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--accent);letter-spacing:.05em}
.summary-top p{color:var(--muted);font-size:13px;margin-top:4px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);letter-spacing:.04em}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.export-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.export-card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.exp-btn{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;cursor:pointer;width:100%;margin-bottom:7px;font-family:'DM Sans',sans-serif;transition:.12s;text-align:left}
.exp-btn:hover{border-color:var(--accent)}
.exp-btn:active{transform:scale(.98)}
.exp-ico{font-size:20px;flex-shrink:0}
.exp-info .t{font-size:13px;font-weight:500;color:var(--text)}
.exp-info .s{font-size:11px;color:var(--muted);margin-top:1px}
.copy-area{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:11px;font-family:monospace;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:110px;overflow-y:auto;margin-top:8px;display:none}
.copy-area.show{display:block}
.copied-toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
.copied-toast.show{opacity:1}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 id="hdr-title">GYM TRACKER</h1>
    <div class="header-right" id="hdr-date"></div>
  </div>

  <!-- == SCREEN 1: PICK == -->
  <div class="screen active" id="scr-pick">
    <div class="scroll-body">
      <div style="margin-bottom:10px;padding-top:2px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Select today's exercises</div>
        <div class="search-wrap">
          <span class="search-icon">&#9906;</span>
          <input class="search-input" type="text" id="search" placeholder="Search exercises..." oninput="filterEx()">
        </div>
      </div>
      <div class="ex-list" id="ex-list"></div>
    </div>
    <div class="pick-footer">
      <div class="sel-count" id="sel-count"></div>
      <button class="btn btn-accent" id="start-btn" onclick="startWorkout()" disabled>Start Workout</button>
    </div>
  </div>

  <!-- == SCREEN 2: WORKOUT == -->
  <div class="screen" id="scr-workout">
    <div class="ex-nav" id="ex-nav"></div>
    <div class="scroll-body" id="ex-content"></div>
  </div>

  <!-- == SCREEN 3: SUMMARY == -->
  <div class="screen" id="scr-summary">
    <div class="scroll-body">
      <div class="summary-top">
        <h2>DONE!</h2>
        <p id="sum-date"></p>
      </div>
      <div class="stats-grid" id="sum-stats"></div>
      <div class="export-card">
        <h3>Export to spreadsheet</h3>
        <button class="exp-btn" onclick="dlCSV()">
          <span class="exp-ico">&#128229;</span>
          <div class="exp-info"><div class="t">Download CSV</div><div class="s">Import into Excel or Google Sheets</div></div>
        </button>
        <button class="exp-btn" onclick="copyRows()">
          <span class="exp-ico">&#128203;</span>
          <div class="exp-info"><div class="t">Copy rows</div><div class="s">Paste directly into your Log sheet</div></div>
        </button>
        <div class="copy-area" id="copy-area"></div>
      </div>
      <button class="btn btn-accent" onclick="resetApp()" style="margin-bottom:32px">New Workout</button>
    </div>
  </div>
</div>

<!-- == REST TIMER OVERLAY == -->
<div class="timer-overlay" id="timer-overlay">
  <div class="timer-lbl">Rest Timer</div>
  <div class="timer-ring">
    <svg viewBox="0 0 220 220" width="220" height="220">
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-fg" id="ring-fg" cx="110" cy="110" r="100"
        stroke-dasharray="628.3" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-num">
      <div class="timer-secs" id="timer-secs">90</div>
      <div class="timer-sub" id="timer-sub">seconds</div>
    </div>
  </div>
  <div class="rest-presets" id="presets">
    <div class="preset" data-s="60" onclick="setPreset(60)">1 min</div>
    <div class="preset active" data-s="90" onclick="setPreset(90)">90s</div>
    <div class="preset" data-s="120" onclick="setPreset(120)">2 min</div>
    <div class="preset" data-s="180" onclick="setPreset(180)">3 min</div>
  </div>
  <div class="timer-btns">
    <button class="btn btn-ghost" onclick="skipTimer()">Skip</button>
    <button class="btn btn-accent" id="timer-action-btn" onclick="toggleTimer()">Pause</button>
  </div>
</div>

<div class="copied-toast" id="toast">Copied!</div>

arget":"Match PR: 20 lbs"},"SM Calf Raises":{"lastDate":"2025-04-15","sets":[{"set":1,"weight":90,"reps":25},{"set":2,"weight":90,"reps":25},{"set":3,"weight":90,"reps":25},{"set":4,"weight":90,"reps":25}],"pr":90,"target":"+5 lbs -> 95 lbs"},"SM Chest Press":{"lastDate":"2025-06-26","sets":[{"set":1,"weight":105,"reps":15},{"set":2,"weight":105,"reps":10},{"set":3,"weight":105,"reps":7},{"set":4,"weight":105,"reps":7},{"set":5,"weight":105,"reps":5}],"pr":105,"target":"+5 lbs -> 110 lbs"},"SM Close Grip Press":{"lastDate":"2025-06-05","sets":[{"set":1,"weight":80,"reps":13},{"set":2,"weight":80,"reps":13},{"set":3,"weight":80,"reps":10},{"set":4,"weight":80,"reps":11}],"pr":80,"target":"+5 lbs -> 85 lbs"},"SM Incline Press":{"lastDate":"2025-05-22","sets":[{"set":1,"weight":90,"reps":6},{"set":2,"weight":90,"reps":7},{"set":3,"weight":90,"reps":7},{"set":4,"weight":90,"reps":7}],"pr":90,"target":"+1 rep @ 90 lbs"},"SM Mil Press":{"lastDate":"2025-03-20","sets":[{"set":1,"weight":40,"reps":10},{"set":2,"weight":40,"reps":9},{"set":3,"weight":40,"reps":7},{"set":4,"weight":40,"reps":7}],"pr":40,"target":"+1 rep @ 40 lbs"},"SM Squat":{"lastDate":"2025-06-17","sets":[{"set":1,"weight":110,"reps":12},{"set":2,"weight":140,"reps":6},{"set":3,"weight":140,"reps":8},{"set":4,"weight":140,"reps":8},{"set":5,"weight":140,"reps":8}],"pr":140,"target":"+5 lbs -> 115 lbs"},"Seated CBL Rows":{"lastDate":"2025-06-02","sets":[{"set":1,"weight":90,"reps":18},{"set":2,"weight":90,"reps":14},{"set":3,"weight":90,"reps":17},{"set":4,"weight":90,"reps":13}],"pr":90,"target":"+5 lbs -> 95 lbs"},"Shoulder Press Machine":{"lastDate":"2025-05-29","sets":[{"set":1,"weight":30,"reps":20},{"set":2,"weight":30,"reps":20},{"set":3,"weight":30,"reps":16},{"set":4,"weight":30,"reps":15}],"pr":30,"target":"+2.5 lbs -> 32.5 lbs"},"Side Wood Chop":{"lastDate":"2025-06-24","sets":[{"set":1,"weight":30,"reps":10},{"set":2,"weight":30,"reps":10},{"set":3,"weight":30,"reps":10},{"set":4,"weight":30,"reps":10}],"pr":35,"target":"Match PR: 35 lbs"},"Tbar Deadlift":{"lastDate":"2025-07-02","sets":[{"set":1,"weight":185,"reps":15},{"set":2,"weight":185,"reps":12},{"set":3,"weight":185,"reps":10},{"set":4,"weight":185,"reps":11},{"set":5,"weight":185,"reps":10}],"pr":185,"target":"+5 lbs -> 190 lbs"},"TrapB Deadlift":{"lastDate":"2025-04-14","sets":[{"set":1,"weight":150,"reps":10},{"set":2,"weight":150,"reps":10},{"set":3,"weight":150,"reps":10},{"set":4,"weight":150,"reps":10},{"set":5,"weight":150,"reps":10}],"pr":150,"target":"+1 rep @ 150 lbs"},"Tri Pushdwn":{"lastDate":"2025-05-12","sets":[{"set":1,"weight":42.5,"reps":10},{"set":2,"weight":42.5,"reps":10},{"set":3,"weight":42.5,"reps":8},{"set":4,"weight":42.5,"reps":8}],"pr":42.5,"target":"+1 rep @ 42.5 lbs"},"Weighted BW Dips":{"lastDate":"2025-06-02","sets":[{"set":1,"weight":10,"reps":10},{"set":2,"weight":10,"reps":9},{"set":3,"weight":10,"reps":7},{"set":4,"weight":10,"reps":7}],"pr":10,"target":"+1 rep @ 10 lbs"},"Wood Chop":{"lastDate":"2025-06-02","sets":[{"set":1,"weight":30,"reps":20},{"set":2,"weight":30,"reps":15},{"set":3,"weight":30,"reps":15},{"set":4,"weight":30,"reps":15}],"pr":30,"target":"+2.5 lbs -> 32.5 lbs"},"Wrist Roller":{"lastDate":"2025-04-09","sets":[{"set":1,"weight":10,"reps":2},{"set":2,"weight":10,"reps":2},{"set":3,"weight":10,"reps":2},{"set":4,"weight":10,"reps":2}],"pr":10,"target":"+1 rep @ 10 lbs"},"sin arm db skull":{"lastDate":"2026-05-14","sets":[{"set":1,"weight":10,"reps":10},{"set":2,"weight":10,"reps":8},{"set":3,"weight":10,"reps":7},{"set":4,"weight":10,"reps":6}],"pr":10,"target":"+1 rep @ 10 lbs"}};

/* ======= STATE ======= */
const ALL = Object.keys(HISTORY).sort();
let selected=[], workout=[], curEx=0, logSets={}, doneMap={}, workoutDate=new Date();

/* ======= TIMER STATE ======= */
let timerTotal=90, timerLeft=90, timerRunning=false, timerInterval=null, timerPreset=90;
const CIRC = 2*Math.PI*100; // circumference for r=100

/* ======= UTILS ======= */
const f=n=>Number.isInteger(n)?n:n;
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
const qs=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));qs(id).classList.add('active')}

/* ======= INIT ======= */
qs('hdr-date').textContent = workoutDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
renderList();

/* ======= PICKER ======= */
function filterEx(){renderList(qs('search').value.toLowerCase())}
function renderList(q=''){
  const matches=ALL.filter(e=>e.toLowerCase().includes(q));
  qs('ex-list').innerHTML = matches.length
    ? matches.map((ex,idx)=>{
        const h=HISTORY[ex],isSel=selected.includes(ex);
        return `<div class="ex-item${isSel?' sel':''}" data-idx="${idx}">
          <div><div class="ex-name">${ex}</div><div class="ex-meta">Last: ${fmtD(h.lastDate)} &nbsp;&middot;&nbsp; PR: ${f(h.pr)} lbs</div></div>
          <div class="chk">${isSel?'&#10003;':''}</div></div>`;
      }).join('')
    : '<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">No exercises found</div>';
  // Attach click listeners via data-idx to avoid quote-escaping issues in onclick
  const q2=qs('search').value.toLowerCase();
  const matches2=ALL.filter(e=>e.toLowerCase().includes(q2));
  qs('ex-list').querySelectorAll('.ex-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const ex=matches2[parseInt(el.dataset.idx)];
      const i=selected.indexOf(ex);
      if(i===-1) selected.push(ex); else selected.splice(i,1);
      renderList(qs('search').value.toLowerCase());
    });
  });
  updateCount();
}
function updateCount(){
  qs('sel-count').textContent=selected.length?`${selected.length} exercise${selected.length>1?'s':''} selected`:'';
  qs('start-btn').disabled=!selected.length;
}

/* ======= WORKOUT ======= */
function startWorkout(){
  workout=[...selected]; logSets={}; doneMap={}; curEx=0;
  workout.forEach(ex=>{
    logSets[ex]=HISTORY[ex].sets.map(s=>({weight:s.weight,reps:s.reps,done:false}));
  });
  qs('hdr-title').textContent='WORKOUT';
  show('scr-workout');
  renderWorkout();
}
function goEx(i){curEx=i;renderWorkout()}
function renderWorkout(){renderNav();renderEx()}

function renderNav(){
  qs('ex-nav').innerHTML=workout.map((ex,i)=>{
    const isDone=doneMap[ex]&&doneMap[ex].length>0,isActive=i===curEx;
    const short=ex.length>13?ex.slice(0,12)+'...':ex;
    return `<div class="ex-tab${isActive?' cur':''}${isDone?' ok':''}" onclick="goEx(${i})">${short}</div>`;
  }).join('');
}

function renderEx(){
  const ex=workout[curEx],h=HISTORY[ex],sets=logSets[ex];
  let html=`
  <div class="ex-card">
    <div class="ex-card-top">
      <div class="ex-card-name">${ex}</div>
      <div class="ex-card-date">Last: ${fmtD(h.lastDate)}</div>
    </div>
    <div class="pr-pill">&#127942; All-time PR: ${f(h.pr)} lbs</div>
    <div class="target-box">
      <div style="font-size:22px">&#127919;</div>
      <div class="target-txt"><div class="target-lbl">Today's target</div><div class="target-val">${h.target}</div></div>
    </div>
    <div class="section-lbl">Last session</div>
    <table class="last-tbl">
      <thead><tr><th>#</th><th>Weight</th><th>Reps</th><th></th></tr></thead>
      <tbody>${h.sets.map((s,i)=>{
        const isPR=s.weight>=h.pr;
        return `<tr><td>${i+1}</td><td>${f(s.weight)} lbs</td><td>${s.reps}</td><td>${isPR?'<span class="pr-tag">PR</span>':''}</td></tr>`;
      }).join('')}</tbody>
    </table>
  </div>

  <div class="section-lbl">Log today's sets</div>
  <div id="log-sets-wrap">
  ${sets.map((s,i)=>`
    <div class="log-set${s.done?' done':''}" id="ls-${i}">
      <div class="set-lbl">S${i+1}</div>
      <input class="set-inp" type="number" id="w-${i}" value="${f(s.weight)}" step="2.5" inputmode="decimal" placeholder="lbs" oninput="syncSet(${i})">
      <input class="set-inp" type="number" id="r-${i}" value="${s.reps}" step="1" inputmode="numeric" placeholder="reps" oninput="syncSet(${i})">
      <button class="done-btn${s.done?' on':''}" onclick="markDone(${i})">${s.done?'&#10003;':'&#9675;'}</button>
    </div>`).join('')}
  </div>
  <button class="add-set-btn" onclick="addSet()">+ Add set</button>
  <div class="nav-row">
    ${curEx>0?`<button class="btn btn-ghost" onclick="goEx(${curEx-1})">&#8592; Back</button>`:''}
    ${curEx<workout.length-1
      ? `<button class="btn btn-accent" style="flex:2" onclick="goEx(${curEx+1})">Next &#8594;</button>`
      : `<button class="btn btn-accent" style="flex:2" onclick="finish()">Finish Workout</button>`}
  </div>`;
  qs('ex-content').innerHTML=html;
}

function syncSet(i){
  const ex=workout[curEx];
  logSets[ex][i].weight=parseFloat(qs('w-'+i).value)||0;
  logSets[ex][i].reps=parseInt(qs('r-'+i).value)||0;
}
function markDone(i){
  syncSet(i);
  const ex=workout[curEx],s=logSets[ex][i];
  s.done=!s.done;
  const row=qs('ls-'+i),btn=row.querySelector('.done-btn');
  if(s.done){
    row.classList.add('done');btn.classList.add('on');btn.textContent='&#10003;';
    if(!doneMap[ex])doneMap[ex]=[];
    if(!doneMap[ex].includes(i))doneMap[ex].push(i);
    startTimer(); // <- launch rest timer on set completion
  } else {
    row.classList.remove('done');btn.classList.remove('on');btn.textContent='&#9675;';
    doneMap[ex]=(doneMap[ex]||[]).filter(x=>x!==i);
  }
  renderNav();
}
function addSet(){
  const ex=workout[curEx],sets=logSets[ex],last=sets[sets.length-1];
  sets.push({weight:last.weight,reps:last.reps,done:false});
  renderEx();
}

/* ======= REST TIMER ======= */
function setPreset(s){
  timerPreset=s;
  document.querySelectorAll('.preset').forEach(p=>{
    p.classList.toggle('active',parseInt(p.dataset.s)===s);
  });
  if(!timerRunning){timerTotal=s;timerLeft=s;updateTimerUI();}
}
function startTimer(){
  timerTotal=timerPreset; timerLeft=timerPreset; timerRunning=true;
  qs('timer-overlay').classList.add('show');
  qs('timer-action-btn').textContent='Pause';
  clearInterval(timerInterval);
  updateTimerUI();
  timerInterval=setInterval(()=>{
    if(!timerRunning)return;
    timerLeft--;
    updateTimerUI();
    if(timerLeft<=0){
      clearInterval(timerInterval);
      timerRunning=false;
      qs('timer-action-btn').textContent='Start';
      // Buzz/beep
      try{const ctx=new AudioContext();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.start();o.stop(ctx.currentTime+0.5);}catch(e){}
    }
  },1000);
}
function toggleTimer(){
  if(timerLeft<=0){startTimer();return;}
  timerRunning=!timerRunning;
  qs('timer-action-btn').textContent=timerRunning?'Pause':'Resume';
}
function skipTimer(){
  clearInterval(timerInterval);timerRunning=false;
  qs('timer-overlay').classList.remove('show');
}
function updateTimerUI(){
  const m=Math.floor(timerLeft/60),s=timerLeft%60;
  qs('timer-secs').textContent=timerLeft>=60?`${m}:${s.toString().padStart(2,'0')}`:timerLeft;
  qs('timer-sub').textContent=timerLeft>=60?'remaining':'seconds';
  const pct=timerTotal>0?timerLeft/timerTotal:0;
  qs('ring-fg').style.strokeDashoffset=CIRC*(1-pct);
  // Turn ring red when under 10s
  qs('ring-fg').style.stroke=timerLeft<=10&&timerLeft>0?'var(--red)':'var(--accent)';
}

/* ======= SUMMARY ======= */
function buildRows(){
  const today=workoutDate.toISOString().slice(0,10),rows=[];
  workout.forEach(ex=>{
    logSets[ex].forEach((s,i)=>{
      if(s.weight>0&&s.reps>0) rows.push({date:today,exercise:ex,set:i+1,weight:s.weight,reps:s.reps,volume:Math.round(s.weight*s.reps)});
    });
  });
  return rows;
}
function finish(){
  qs('hdr-title').textContent='SUMMARY';
  show('scr-summary');
  const rows=buildRows();
  const vol=rows.reduce((a,r)=>a+r.volume,0);
  qs('sum-date').textContent=workoutDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  qs('sum-stats').innerHTML=`
    <div class="stat-card"><div class="stat-val">${workout.length}</div><div class="stat-lbl">Exercises</div></div>
    <div class="stat-card"><div class="stat-val">${rows.length}</div><div class="stat-lbl">Total Sets</div></div>
    <div class="stat-card"><div class="stat-val">${vol.toLocaleString()}</div><div class="stat-lbl">Volume (lbs)</div></div>
    <div class="stat-card"><div class="stat-val">${rows.length?Math.round(rows.reduce((a,r)=>a+r.reps,0)/rows.length):0}</div><div class="stat-lbl">Avg Reps</div></div>`;
}
function dlCSV(){
  const rows=buildRows();
  const csv='Date,Exercise,Set #,Weight (lbs),Reps,Volume\n'+rows.map(r=>`${r.date},${r.exercise},${r.set},${r.weight},${r.reps},${r.volume}`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`workout_${workoutDate.toISOString().slice(0,10)}.csv`;
  a.click();
}
function copyRows(){
  const area=qs('copy-area');
  if(area.classList.contains('show')){area.classList.remove('show');return;}
  const text=buildRows().map(r=>`${r.date}\t${r.exercise}\t${r.set}\t${r.weight}\t${r.reps}\t${r.volume}`).join('\n');
  area.textContent=text;area.classList.add('show');
  navigator.clipboard.writeText(text).then(()=>{
    const t=qs('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
  }).catch(()=>{});
}
function resetApp(){
  clearInterval(timerInterval);timerRunning=false;
  qs('timer-overlay').classList.remove('show');
  selected=[];workout=[];logSets={};doneMap={};curEx=0;
  qs('hdr-title').textContent='GYM TRACKER';
  qs('search').value='';
  renderList();show('scr-pick');
}
</script>
</body>
</html>
